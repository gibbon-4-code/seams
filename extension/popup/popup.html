<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #1f2937;
    }
    .info {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .status {
      padding: 12px;
      background: #dbeafe;
      border-radius: 6px;
      font-size: 13px;
      color: #1e40af;
      margin-bottom: 16px;
    }
    .setting {
      margin-bottom: 12px;
    }
    label {
      font-size: 13px;
      display: block;
      margin-bottom: 4px;
      color: #374151;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    button {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 13px;
      font-weight: 500;
    }
    button:hover {
      background: #0284c7;
    }
    .footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Seams Quality Evaluator</h1>

  <div class="status">
    ✓ Extension active
  </div>

  <div class="info">
    Navigate to a t-shirt product page to see quality evaluation overlay.
  </div>

  <div class="setting">
    <label>Backend API URL:</label>
    <input type="text" id="apiUrl" value="http://localhost:8000" />
  </div>

  <button id="save">Save Settings</button>

  <div class="footer">
    Seams v0.1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
